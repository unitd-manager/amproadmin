name: CI - Generate Tests & Run

on:
  push:
    branches:
      - main

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.18.0

      - name: Install dependencies
        run: npm install

      - name: Generate tests with HuggingFace API
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: node scripts/generate-tests-hf.js

      - name: Commit & push generated tests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tests/
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-generated tests via HuggingFace"
            git push
          else
            echo "No new tests generated"
          fi

      - name: Run Jest tests
        run: |
          npm test -- --json --outputFile=test-results.json

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: jest-test-results
          path: test-results.json

      - name: Email test results (optional)
        if: success() || failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Actions Jest Test Results"
          body: "Attached are the latest Jest test results."
          to: smsaf91@gmail.com
          from: smsaf9180@gmail.com
          secure: true
          attachments: test-results.json
  